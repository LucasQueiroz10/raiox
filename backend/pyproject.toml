# Só configuração de ferramentas. As dependências ficam em requirements*.txt.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# S = regras de segurança (flake8-bandit).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "S"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é o próprio mecanismo do pytest.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yfinance".msg = "yfinance é proibido no backend (ver CLAUDE.md)."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
