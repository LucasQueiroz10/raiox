# Migracoes do banco (ADR 0006, secao 8). Comandos em backend/CLAUDE.md, secao "Banco".
# A conexao vem so da variavel RX_BANCO_URL, nunca deste arquivo.
# Arquivo so em ASCII: o Alembic e o logging o leem com a codificacao do sistema.

[alembic]
script_location = %(here)s/banco/migracoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
