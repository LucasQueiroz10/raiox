# PostgreSQL de desenvolvimento e do CI (ADR 0006). Rodar dentro de backend/:
#   docker compose up -d --wait
# Só para desenvolvimento: aceita conexão sem senha (trust), por isso só escuta em 127.0.0.1.
# Nenhum segredo no repositório. A versão (17) vale até o ADR de hospedagem confirmar a do provedor.
name: rx

services:
  banco:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Porta 5433 no computador, para não brigar com um PostgreSQL instalado direto na 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dados:
