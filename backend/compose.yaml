# PostgreSQL de desenvolvimento e do CI (ADR 0006). Rodar dentro de backend/:
#   docker compose up -d --wait
# Só para desenvolvimento: aceita conexão sem senha (trust), por isso só escuta em 127.0.0.1.
# Nenhum segredo no repositório. A versão (17) é a mesma do Cloud SQL em produção (ADR 0007).
name: rx

services:
  banco:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Porta 5433 no computador, para não brigar com um PostgreSQL instalado direto na 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dados:
