version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # O typescript-eslint 8.x só aceita TypeScript abaixo de 6.1 (ver ADR 0003).
      # Remover esta regra quando o typescript-eslint suportar o TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A versão do PostgreSQL só muda com o ADR de hospedagem (ADR 0006, seção 1).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Só as correções (3.14.x) e o digest. O Python muda de versão (3.15) junto com o CI e o
      # target-version do ruff, à mão.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
