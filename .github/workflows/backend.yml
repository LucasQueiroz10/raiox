name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Formatação (ruff)
        run: python -m ruff format --check .

      - name: Testes (pytest)
        # Os testes do lote (ingest/ e irrae/) rodam no job "lote", com as dependências científicas,
        # e os testes com PostgreSQL rodam no job "banco".
        run: python -m pytest --ignore=tests/irrae --ignore=tests/ingest --ignore=tests/banco

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit --require-hashes --disable-pip -r requirements.txt

  lote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências (desenvolvimento + lote)
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-lote.txt

      - name: Testes do lote (ingest e IrRAE)
        run: python -m pytest tests/ingest tests/irrae

      - name: Auditoria de dependências do lote (pip-audit)
        run: pip-audit --require-hashes --disable-pip -r requirements-lote.txt

  banco:
    # Testes com PostgreSQL (ADR 0006): migrações a partir do banco vazio e permissões.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Subir o PostgreSQL (a mesma imagem fixada do desenvolvimento)
        run: docker compose up -d --wait

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Testes com banco
        env:
          RX_BANCO_TESTE_URL: postgresql+psycopg://postgres@127.0.0.1:5433/postgres
        run: python -m pytest tests/banco

  imagem:
    # A imagem de produção (Dockerfile; ADR 0007), testada como roda no Cloud Run: migrações, carga
    # da CVM com zip sintético e a API lendo o banco, num PostgreSQL descartável.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências (o script gera o zip sintético e confere a API com o Python)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Construir e testar a imagem
        run: bash scripts/testar_imagem.sh
